[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movens-zero"
version = "0.2.0"
description = "Multimodal humanoid motion generation with Movens-Zero"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "accelerate>=1.0,<2",
    "diffusers==0.37.0",
    "numpy==1.26.4",
    "safetensors==0.6.2",
    "torch==2.7.0",
    "transformers==4.57.0",
    "huggingface-hub>=0.34,<1.0",
    "pillow>=10,<13",
    "torchvision==0.22.0",
]

[project.optional-dependencies]
flash = [
    "flash-attn==2.7.4.post1",
]
train = [
    "pyarrow>=16,<22",
    "scipy>=1.10,<2",
]
eval = [
    "datasets>=4,<5",
    "pyarrow>=16,<22",
    "scipy>=1.10,<2",
    "mujoco>=3.2,<4",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<3",
    "pytorch-lightning>=2.4,<2.7",
    "sentencepiece>=0.2,<0.3",
    "librosa>=0.10,<0.12",
    "onnxruntime-gpu>=1.18,<2",
    "pandas>=2.2,<2.4",
    "tqdm>=4.66,<5",
]

[project.scripts]
movens-zero = "movens_zero.inference:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["movens_zero*"]

[tool.setuptools.package-data]
movens_zero = ["assets/*.json", "assets/*.npy"]
